# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages
# This file was contributed by Edwin Betancourt, EdwinBetanc0urt@outlook.com

name: Publish Project

on:
  release:
    types:
      - created
      - edited

jobs:

  # Build dist application ADempiere-Site
  build-pages:
    name: Build dist ADempiere-Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 7

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Blog
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: pnpm run build:vite

      - name: Upload dist files
        uses: actions/upload-artifact@v3
        with:
          name: adempiere-site
          path: dist


  # Publish dist binaries to page
  publish-app-dist:
    name: Upload ADempiere-Site binaries
    # TODO: Does not support edit release: {"resource":"Release","code":"already_exists","field":"tag_name"}
    if: ${{ github.event_name == 'release' && github.event.action == 'created' }}
    needs:
      - build-pages
    runs-on: ubuntu-latest
    steps:
      - name: Download build dist app
        uses: actions/download-artifact@v3
        with:
          name: adempiere-site

      - name: Compress files for application dist
        uses: TheDoctor0/zip-release@0.6.2
        with:
          filename: 'Adempiere-Site.zip'
          path: './'

      - name: Create checksum sha256 file
        run: sha512sum Adempiere-Site.zip > Adempiere-Site.zip.sha512

      - name: Publish application binary in repository
        uses: skx/github-action-publish-binaries@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: 'Adempiere-Site.zip'

      - name: Publish checksum of file
        uses: skx/github-action-publish-binaries@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: 'Adempiere-Site.zip.sha512'


  # Publish docker alpine image to GitHub Container Registry
  push-alpine-ghcr:
    name: Push docker alpine image to GitHub Container Registry
    needs:
      - build-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Download build dist app
        uses: actions/download-artifact@v3
        with:
          name: adempiere-site
          path: dist

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker Image Alpine
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build-docker/production-alpine.Dockerfile
          push: true
          tags: |
            ghcr.io/adempiere/adempiere-landing-page:alpine
            ghcr.io/adempiere/adempiere-landing-page:alpine-${{ github.event.release.tag_name }}

